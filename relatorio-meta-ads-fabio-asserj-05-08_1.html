<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório de Performance — Meta Ads | Keep ads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --panel:#ffffff; --panel2:#f7f9fb; --line:#e8ebef; --line2:#d8dde3;
 --txt:#0D0D0D; --dim:#6b7280; --dim2:#9aa5b1;
 --green:#00CA9E; --green-d:#00a884;
 --alert:#ef5b4c; --amber:#D69022; --slate:#6E86A6;
 --shadow:0 1px 3px rgba(13,13,13,.04); --shadow2:0 6px 24px rgba(13,13,13,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Poppins',sans-serif;background:var(--panel2);color:var(--txt);line-height:1.5;padding:0 0 60px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
h1,h2,h3,.pop{font-family:'Poppins',sans-serif}

/* header */
header{background:var(--panel);border-bottom:2px solid var(--txt);padding:22px 0 20px;margin-bottom:24px}
.brand{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
.logo{font-family:'Poppins';font-weight:800;font-size:24px;letter-spacing:-.5px}
.logo .k{color:var(--green-d)} .logo .a{color:var(--txt)}
.logo small{display:block;font-size:10px;font-weight:500;color:var(--dim2);letter-spacing:2px;text-transform:uppercase;margin-top:-2px}
.hd-meta{text-align:right}
.hd-meta .t{font-family:'Poppins';font-weight:700;font-size:15px}
.hd-meta .s{font-size:12px;color:var(--dim)}

/* account tabs */
.acct{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.acct button{font-family:'Poppins';font-weight:600;font-size:14px;padding:11px 20px;border:1px solid var(--line2);background:var(--panel);color:var(--dim);border-radius:12px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.acct button .h{font-size:11px;font-weight:500;color:var(--dim2)}
.acct button.on{background:var(--green);color:#fff;border-color:var(--green)}
.acct button.on .h{color:rgba(255,255,255,.85)}

/* kpi overview */
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--dim2);display:flex;align-items:center;gap:6px}
.kpi .dot{width:8px;height:8px;border-radius:50%}
.kpi .num{font-family:'Poppins';font-weight:800;font-size:28px;margin-top:8px;letter-spacing:-.5px}
.kpi .sub{font-size:12px;color:var(--dim);margin-top:2px}

/* section */
.sec-title{font-family:'Poppins';font-weight:700;font-size:16px;margin:30px 0 14px;display:flex;align-items:center;gap:10px}
.sec-title .bar{width:4px;height:18px;background:var(--green);border-radius:2px}

/* obj filter */
.filter{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.filter button{font-family:'Poppins';font-weight:600;font-size:13px;padding:8px 16px;border:1px solid var(--line2);background:var(--panel);color:var(--dim);border-radius:20px;cursor:pointer;transition:.15s}
.filter button.on{background:var(--txt);color:#fff;border-color:var(--txt)}

/* obj panel */
.obj{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:0;box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.obj-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
.obj-head .left{display:flex;align-items:center;gap:12px}
.obj-tag{font-family:'Poppins';font-weight:700;font-size:15px;padding:5px 12px;border-radius:8px;color:#fff}
.obj-desc{font-size:12px;color:var(--dim);max-width:340px}
.obj-stats{display:flex;gap:26px;flex-wrap:wrap}
.obj-stats .st .v{font-family:'Poppins';font-weight:800;font-size:20px;letter-spacing:-.4px}
.obj-stats .st .l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--dim2)}

/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-family:'Poppins';font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim2);padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel2)}
thead th.r,tbody td.r{text-align:right}
tbody td{padding:11px 20px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel2)}
.cname{font-weight:500;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barcell{position:relative}
.barwrap{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.minibar{height:7px;border-radius:4px;min-width:4px}
.val-strong{font-family:'Poppins';font-weight:700}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.pill.good{background:rgba(0,202,158,.12);color:var(--green-d)}
.pill.warn{background:rgba(214,144,34,.14);color:var(--amber)}
.pill.bad{background:rgba(239,91,76,.12);color:var(--alert)}

/* diagnostic */
.diag{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.diag h3{font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.diag p{font-size:13.5px;color:#31363c;margin-bottom:14px}
.diag p b{color:var(--txt)}
.diag .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:6px 0 18px}
.acard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px}
.acard .h{font-family:'Poppins';font-weight:700;font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.acard .h .n{width:20px;height:20px;border-radius:6px;background:var(--green);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.acard p{font-size:12.5px;color:var(--dim);margin:0}
.acard .imp{font-size:11.5px;color:var(--green-d);font-weight:600;margin-top:8px}
.split{height:1px;background:var(--line);margin:20px 0}
.note{font-size:11.5px;color:var(--dim2);border-left:3px solid var(--line2);padding:6px 0 6px 12px;margin-top:10px}
footer{text-align:center;font-size:11px;color:var(--dim2);margin-top:34px}
.hidden{display:none}
@media(max-width:820px){.kgrid{grid-template-columns:repeat(2,1fr)}.diag .grid2{grid-template-columns:1fr}.cname{max-width:180px}}
</style>
</head>

const OBJ_META = {
 'Reconhecimento':{color:'#6E86A6', unit:'Alcance', unitShort:'pessoas', costLabel:'CPM (custo/mil)',
   desc:'Fazer a marca aparecer para o máximo de gente do setor. Métrica: pessoas alcançadas e custo por mil impressões.'},

};
const OBJ_ORDER=['Tráfego','Engajamento','Reconhecimento'];

let curAcct='fabio', curFilter='Todos';
const fmtBRL=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN=v=>v.toLocaleString('pt-BR');
const fmtC=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:v<0.1?4:2,maximumFractionDigits:v<0.1?4:2});

function cpmOf(o){return o.cpr*1000;}
function unitCost(name,o){return name==='Reconhecimento'?cpmOf(o):o.cpr;}

function buildAcct(){
 const el=document.getElementById('acct'); el.innerHTML='';
 for(const k in DATA){const a=DATA[k];const b=document.createElement('button');
  b.className=k===curAcct?'on':''; b.innerHTML=`${a.label}<span class="h">${a.handle}</span>`;
  b.onclick=()=>{curAcct=k;curFilter='Todos';render();}; el.appendChild(b);}
}
function buildFilter(){
 const el=document.getElementById('filter'); el.innerHTML='';
 ['Todos',...OBJ_ORDER].forEach(f=>{const b=document.createElement('button');
  b.className=f===curFilter?'on':''; b.textContent=f;
  b.onclick=()=>{curFilter=f;render();}; el.appendChild(b);});
}
function buildKpi(){
 const a=DATA[curAcct], o=a.obj, el=document.getElementById('kgrid');
 const cards=[
  {lab:'Investimento total',dot:'var(--txt)',num:fmtBRL(a.total),sub:'no período'},
  {lab:'Alcance',dot:OBJ_META['Reconhecimento'].color,num:fmtN(o['Reconhecimento'].res),sub:'pessoas alcançadas'},
  {lab:'Interações',dot:OBJ_META['Engajamento'].color,num:fmtN(o['Engajamento'].res),sub:'curtidas, coment., salv.'},
  {lab:'Visitas ao perfil',dot:OBJ_META['Tráfego'].color,num:fmtN(o['Tráfego'].res),sub:'topo do funil de seguidor'}
 ];
 el.innerHTML=cards.map(c=>`<div class="kpi"><div class="lab"><span class="dot" style="background:${c.dot}"></span>${c.lab}</div><div class="num">${c.num}</div><div class="sub">${c.sub}</div></div>`).join('');
}
function objPanel(name){
 const a=DATA[curAcct], o=a.obj[name], m=OBJ_META[name];
 const share=(o.val/a.total*100);
 const uc=unitCost(name,o);
 const maxRes=Math.max(...o.creatives.map(c=>c.res),1);
 const rows=o.creatives.map(c=>{
   const w=(c.res/maxRes*100).toFixed(0);
   const cu=name==='Reconhecimento'?c.cpr*1000:c.cpr;
   return `<tr>
     <td class="cname" title="${c.name.replace(/"/g,'')}">${c.name}</td>
     <td class="r barcell"><div class="barwrap"><div class="minibar" style="width:${w}%;background:${m.color}"></div><span class="val-strong">${fmtN(c.res)}</span></div></td>
     <td class="r">${fmtC(cu)}</td>
     <td class="r">${fmtBRL(c.val)}</td></tr>`;}).join('');
 return `<div class="obj">
  <div class="obj-head">
   <div class="left"><span class="obj-tag" style="background:${m.color}">${name}</span>
     <span class="obj-desc">${m.desc}</span></div>
   <div class="obj-stats">
     <div class="st"><div class="v">${fmtBRL(o.val)}</div><div class="l">Investido · ${share.toFixed(0)}% da verba</div></div>
     <div class="st"><div class="v">${fmtN(o.res)}</div><div class="l">${m.unit}</div></div>
     <div class="st"><div class="v" style="color:${m.color}">${fmtC(uc)}</div><div class="l">${m.costLabel}</div></div>
   </div></div>
  <table><thead><tr><th>Criativo</th><th class="r">${m.unit}</th><th class="r">${m.costLabel.split(' ')[0]==='CPM'?'CPM':'Custo unit.'}</th><th class="r">Investido</th></tr></thead>
  <tbody>${rows}</tbody></table></div>`;
}
function buildObj(){
 const el=document.getElementById('objwrap');
 const list=curFilter==='Todos'?OBJ_ORDER:[curFilter];
 el.innerHTML=list.map(objPanel).join('');
}
function buildDiag(){document.getElementById('diag').innerHTML=DIAG[curAcct];}

function render(){buildAcct();buildFilter();buildKpi();buildObj();buildDiag();}
